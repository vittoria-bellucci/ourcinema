<!DOCTYPE html>

<html>

<head>

<title>
our movie diary ♡
</title>


<style>

* {
    box-sizing:border-box;
}


body {

    margin:0;

    min-height:100vh;

    padding:40px;

    background:

    radial-gradient(
        circle at top,
        rgba(255,255,255,0.12),
        transparent 25%
    ),

    linear-gradient(
        160deg,
        #090911,
        #151321,
        #26213a
    );


    color:#f5f1f4;

    font-family:Arial,sans-serif;

}



header {

    text-align:center;

    margin-bottom:50px;

}



h1 {

    font-family:Georgia,serif;

    font-size:38px;

    font-weight:normal;

}



.subtitle {

    color:#aaa0ae;

    letter-spacing:4px;

    font-size:11px;

    text-transform:uppercase;

}



.diary {

    max-width:700px;

    margin:auto;

}



.entry {

    background:

    rgba(255,255,255,0.07);


    border:

    1px solid rgba(255,255,255,0.15);


    border-radius:20px;


    padding:30px;


    margin-bottom:25px;


    backdrop-filter:blur(15px);


    position:relative;

}



.film {

    font-size:45px;

}



.title {

    font-family:Georgia,serif;

    font-size:28px;

    margin-top:15px;

}



.details {

    color:#aaa0ae;

    font-size:13px;

    margin-top:10px;

}



.note {

    margin-top:20px;

    font-style:italic;

    color:#d5ccd8;

}



.stars {

    position:absolute;

    top:25px;

    right:30px;

}



</style>


</head>



<body>



<header>

<h1>
our movie diary ♡
</h1>


<div class="subtitle">
little films, little memories
</div>


</header>




<div class="diary">



<div class="entry">


<div class="film">
🎞️
</div>


<div class="stars">
★★★★★
</div>


<div class="title">
Interstellar
</div>


<div class="details">
2014 · sci-fi · watched together
</div>


<div class="note">

"our little midnight adventure ✦"

</div>


</div>





<div class="entry">


<div class="film">
🎞️
</div>


<div class="stars">
★★★★☆
</div>


<div class="title">
Your Name
</div>


<div class="details">
2016 · anime · watched together
</div>


<div class="note">

"one of our comfort movies ♡"

</div>


</div>



</div>



</body>

</html>
