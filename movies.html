<!DOCTYPE html>

<html>

<head>

<title>
our movie diary ♡
</title>


<style>

body {

    margin:0;

    min-height:100vh;

    background:

    linear-gradient(
        160deg,
        #090911,
        #151321,
        #26213a
    );

    color:white;

    font-family:Arial,sans-serif;

    padding:40px;

}


h1 {

    font-family:Georgia,serif;

    text-align:center;

    font-size:35px;

}


.subtitle {

    text-align:center;

    color:#aaa0ae;

    letter-spacing:3px;

    font-size:12px;

}



.movie-list {

    max-width:700px;

    margin:40px auto;

}



.movie {

    background:

    rgba(255,255,255,0.07);

    border:

    1px solid rgba(255,255,255,0.1);

    border-radius:20px;

    padding:25px;

    margin-bottom:20px;

    backdrop-filter:blur(15px);

}



.movie h2 {

    font-family:Georgia,serif;

}


.movie p {

    color:#aaa0ae;

}


</style>


</head>



<body>


<h1>
our movie diary ♡
</h1>


<div class="subtitle">

</div>



<div class="movie-list">


<div class="movie">

<h2>
🎬 Interstellar
</h2>


<p>
2014 · sci-fi · watched together
</p>


<p>
"our little midnight adventure ✦"
</p>


</div>



<div class="movie">

<h2>
🎬 Your Name
</h2>


<p>
2016 · anime · watched together
</p>


<p>
"one of our favorites ♡"

</div>


</div>



</body>

</html>
