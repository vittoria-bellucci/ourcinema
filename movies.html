<!DOCTYPE html>

<html>

<head>

<title>
our movie diary ♡
</title>


<style>

* {
    box-sizing:border-box;
}


body {

    margin:0;

    min-height:100vh;

    padding:40px;

    background:

    radial-gradient(
        circle at top,
        rgba(255,255,255,0.12),
        transparent 25%
    ),

    linear-gradient(
        160deg,
        #090911,
        #151321,
        #26213a
    );


    color:#f5f1f4;

    font-family:Arial,sans-serif;

}



header {

    text-align:center;

    margin-bottom:50px;

}



h1 {

    font-family:Georgia,serif;

    font-size:38px;

    font-weight:normal;

}



.subtitle {

    color:#aaa0ae;

    letter-spacing:4px;

    font-size:11px;

    text-transform:uppercase;

}



.diary {

    max-width:700px;

    margin:auto;

}



.entry {

    background:

    rgba(255,255,255,0.07);

    border:

    1px solid rgba(255,255,255,0.15);

    border-radius:20px;

    padding:25px;

    margin-bottom:35px;

    backdrop-filter:blur(15px);

    position:relative;

    overflow:hidden;

}

.entry::before {

    content:"";

    position:absolute;

    top:0;

    left:0;

    width:100%;

    height:6px;

    background:

    repeating-linear-gradient(

    90deg,

    rgba(255,255,255,0.4),

    rgba(255,255,255,0.4) 15px,

    transparent 15px,

    transparent 30px

    );

}

.film {

    font-size:45px;

}



.title {

    font-family:Georgia,serif;

    font-size:28px;

    margin-top:15px;

}



.details {

    color:#aaa0ae;

    font-size:13px;

    margin-top:10px;

}



.note {

    margin-top:20px;

    font-style:italic;

    color:#d5ccd8;

}

.polaroid {

    width:160px;

    background:white;

    padding:10px;

    margin-bottom:20px;

    transform:rotate(-3deg);

}


.photo {

    height:120px;

    background:#ddd;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:45px;

}

.stars {

    position:absolute;

    top:25px;

    right:30px;

}



</style>


</head>



<body>



<header>

<h1>
our movie diary ♡
</h1>


<div class="subtitle">
little films, little memories
</div>


</header>




<div class="diary">

<div class="entry">


<div class="polaroid">

    <div class="photo">
        🎬
    </div>

</div>

<div class="entry">

<div class="polaroid">

    <div class="photo">
        🎬
    </div>

</div>


<div class="stars">
★★★★☆
</div>


<div class="title">
Sore: Istri Dari Masa Depan
</div>


<div class="details">
2025 · Romantic/Sci-fi · watched together
</div>


<div class="note">

"one of our comfort movies and yet, we argued about it ♡"

</div>


</div>

</div>



</div>



</body>

</html>
