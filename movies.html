<!DOCTYPE html>

<html>

<head>

<title>
our movie diary ♡
</title>


<style>

* {
    box-sizing:border-box;
}

#addMovieBtn {

    margin-top:30px;

    padding:14px 30px;

    border-radius:50px;

    border:1px solid rgba(255,255,255,0.2);

    background:rgba(255,255,255,0.08);

    color:white;

    cursor:pointer;

    letter-spacing:2px;

    font-size:12px;

    text-transform:uppercase;

    backdrop-filter:blur(10px);

    transition:0.3s;

}


#addMovieBtn:hover {

    background:rgba(255,255,255,0.18);

    transform:translateY(-3px);

}

    .form-popup {

    display:none;

    position:fixed;

    inset:0;

    background:

    rgba(0,0,0,0.55);

    backdrop-filter:blur(8px);

    align-items:center;

    justify-content:center;

    z-index:10;

}



.form-card {

    width:320px;

    padding:30px;

    border-radius:25px;


    background:

    rgba(255,255,255,0.1);


    border:

    1px solid rgba(255,255,255,0.2);


    backdrop-filter:blur(20px);

}



.form-card h2 {

    font-family:Georgia,serif;

    text-align:center;

    margin-bottom:25px;

}



.form-card input,

.form-card textarea {


    width:100%;

    margin-bottom:12px;

    padding:12px;


    border:none;

    outline:none;


    border-radius:10px;


    background:

    rgba(255,255,255,0.1);


    color:white;

}



.form-card textarea {

    height:90px;

    resize:none;

}

#saveMovie {

    width:100%;

    padding:13px;


    border-radius:50px;


    border:none;


    background:#302a43;


    color:white;


    cursor:pointer;

}
    
body {

    margin:0;

    min-height:100vh;

    padding:40px;

    background:

    radial-gradient(
        circle at top,
        rgba(255,255,255,0.12),
        transparent 25%
    ),

    linear-gradient(
        160deg,
        #090911,
        #151321,
        #26213a
    );


    color:#f5f1f4;

    font-family:Arial,sans-serif;

}



header {

    text-align:center;

    margin-bottom:50px;

}



h1 {

    font-family:Georgia,serif;

    font-size:38px;

    font-weight:normal;

}



.subtitle {

    color:#aaa0ae;

    letter-spacing:4px;

    font-size:11px;

    text-transform:uppercase;

}



.diary {

    max-width:700px;

    margin:auto;

}



.entry {

    background:

    rgba(255,255,255,0.07);

    border:

    1px solid rgba(255,255,255,0.15);

    border-radius:20px;

    padding:25px;

    margin-bottom:35px;

    backdrop-filter:blur(15px);

    position:relative;

    overflow:hidden;

}

.entry::before {

    content:"";

    position:absolute;

    top:0;

    left:0;

    width:100%;

    height:6px;

    background:

    repeating-linear-gradient(

    90deg,

    rgba(255,255,255,0.4),

    rgba(255,255,255,0.4) 15px,

    transparent 15px,

    transparent 30px

    );

}

.film {

    font-size:45px;

}



.title {

    font-family:Georgia,serif;

    font-size:28px;

    margin-top:15px;

}



.details {

    color:#aaa0ae;

    font-size:13px;

    margin-top:10px;

}



.note {

    margin-top:20px;

    font-style:italic;

    color:#d5ccd8;

}

.polaroid {

    width:160px;

    background:white;

    padding:10px;

    margin-bottom:20px;

    transform:rotate(-3deg);

}


.photo {

    height:120px;

    background:#ddd;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:45px;

}

.stars {

    position:absolute;

    top:25px;

    right:30px;

}



</style>


</head>



<body>



<header>

<h1>
our movie diary ♡
</h1>


<div class="subtitle">
little films, little memories
</div>

<button id="addMovieBtn">
+ add movie memory ♡
</button>
   <div id="movieForm" class="form-popup">


    <div class="form-card">


        <h2>
        new memory ♡
        </h2>


        <input 
        id="movieTitle"
        placeholder="movie title..."
        >


        <input 
        id="movieYear"
        placeholder="year..."
        >


        <input 
        id="movieGenre"
        placeholder="genre..."
        >


        <input 
        id="movieRating"
        placeholder="rating (1-5)..."
        >


        <textarea
        id="movieNote"
        placeholder="our little memory..."
        ></textarea>


        <button id="saveMovie">
        save memory ✦
        </button>


    </div>


</div> 
</header>




<div class="diary">

<div class="entry">

<div class="polaroid">

    <div class="photo">
        🎬
    </div>

</div>


<div class="stars">
★★★★☆
</div>


<div class="title">
Sore: Istri Dari Masa Depan
</div>


<div class="details">
2025 · Romantic/Sci-fi · watched together
</div>


<div class="note">

"one of our comfort movies and yet, we argued about it ♡"

</div>


</div>

</div>



</div>

</html>
