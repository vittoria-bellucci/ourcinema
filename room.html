<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>our cinema — room ♡</title>


<style>

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    min-height: 100vh;

    background:
        radial-gradient(
            circle at 50% 20%,
            #26213a 0%,
            #151321 45%,
            #090911 100%
        );

    color: #f5f1f4;

    font-family: Arial, sans-serif;

}


/* top bar */

header {

    height: 70px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 30px;

    border-bottom: 1px solid rgba(255,255,255,0.08);

    background: rgba(10,9,18,0.7);

    backdrop-filter: blur(15px);

}


.logo {

    font-family: Georgia, serif;

    font-size: 22px;

}


.room-name {

    font-size: 12px;

    letter-spacing: 3px;

    text-transform: uppercase;

    color: #aaa0ae;

}



/* layout */

.room {

    display: grid;

    grid-template-columns: 1fr 320px;

    min-height: calc(100vh - 70px);

}



/* browser */

.browser {

    padding: 25px;

    display: flex;

    flex-direction: column;

}


.browser-bar {

    height: 50px;

    display: flex;

    align-items: center;

    gap: 10px;

    padding: 8px 12px;

    background: rgba(255,255,255,0.06);

    border: 1px solid rgba(255,255,255,0.08);

    border-radius: 12px 12px 0 0;

}


.browser-button {

    color: #aaa;

    font-size: 14px;

}


.url-bar {

    flex: 1;

    height: 32px;

    border: none;

    outline: none;

    border-radius: 8px;

    padding: 0 14px;

    background: rgba(255,255,255,0.07);

    color: white;

    font-size: 13px;

}



/* screen */

.screen {

    flex: 1;

    min-height: 500px;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;

    background: rgba(0,0,0,0.35);

    border: 1px solid rgba(255,255,255,0.08);

    border-top: none;

    border-radius: 0 0 12px 12px;

}


.screen-content {

    color: #8f8792;

}


.movie-poster {

    font-size: 70px;

    margin-bottom: 20px;

}


.screen-icon {

    font-size: 45px;

    margin-bottom: 15px;

}


.screen-title {

    font-family: Georgia, serif;

    font-size: 25px;

    color: #ddd5dc;

}



/* movie button */

.movie-button {

    margin-top: 20px;

    padding: 14px 35px;

    border-radius: 50px;

    border: 1px solid rgba(255,255,255,0.25);

    background: rgba(255,255,255,0.08);

    color: white;

    cursor: pointer;

    font-family: Georgia, serif;

    font-size: 12px;

    letter-spacing: 3px;

    text-transform: uppercase;

    transition: 0.3s ease;

}


.movie-button:hover {

    background: rgba(255,255,255,0.18);

    transform: translateY(-3px);

}



/* sidebar */

.sidebar {

    border-left: 1px solid rgba(255,255,255,0.08);

    background: rgba(10,9,18,0.5);

    display: flex;

    flex-direction: column;

}


.people {

    padding: 25px;

    border-bottom: 1px solid rgba(255,255,255,0.08);

}


.section-title {

    font-size: 10px;

    letter-spacing: 3px;

    text-transform: uppercase;

    color: #817783;

    margin-bottom: 20px;

}


.person {

    display: flex;

    align-items: center;

    gap: 12px;

    margin-bottom: 15px;

}


.avatar {

    width: 35px;

    height: 35px;

    border-radius: 50%;

    display: flex;

    align-items: center;

    justify-content: center;

    background: #302a43;

}


.online {

    width: 7px;

    height: 7px;

    border-radius: 50%;

    background: #a8c6a1;

    margin-left: auto;

}



/* chat */

.chat {

    flex: 1;

    padding: 25px;

    display: flex;

    flex-direction: column;

}


.messages {

    flex: 1;

    color: #aaa0ae;

    font-size: 13px;

    line-height: 1.7;

}


.message {

    margin-bottom: 15px;

}


.message strong {

    color: #ddd5dc;

}


.chat-input {

    display: flex;

    gap: 8px;

}


.chat-input input {

    flex: 1;

    border: none;

    outline: none;

    border-radius: 8px;

    padding: 11px;

    background: rgba(255,255,255,0.07);

    color: white;

}


.chat-input button {

    border: none;

    border-radius: 8px;

    padding: 0 15px;

    background: #302a43;

    color: white;

    cursor: pointer;

}



/* mobile */

@media (max-width: 800px) {

    .room {

        grid-template-columns: 1fr;

    }


    .sidebar {

        border-left: none;

        border-top: 1px solid rgba(255,255,255,0.08);

        min-height: 400px;

    }


    .screen {

        min-height: 400px;

    }

}


</style>

</head>


<body>


<header>

<div class="logo">
    our little cinema ♡
</div>


<div class="room-name">
    movie night
</div>

</header>



<div class="room">


<section class="browser">


<div class="browser-bar">

<span class="browser-button">←</span>

<span class="browser-button">→</span>

<span class="browser-button">↻</span>


<input
class="url-bar"
placeholder="search or enter a website..."
>


</div>



<div class="screen">


<div class="screen-content">


<div class="movie-poster">
🎬
</div>


<div class="screen-title">
tonight's movie
</div>


<p>
choose something beautiful to watch together ♡
</p>


<button class="movie-button">
add movie
</button>


</div>


</div>


</section>




<aside class="sidebar">


<div class="people">


<div class="section-title">
watching together
</div>


<div class="person">

<div class="avatar">
♡
</div>

<span>
you
</span>

<div class="online"></div>

</div>



<div class="person">

<div class="avatar">
♡
</div>

<span>
boyfriend
</span>

<div class="online"></div>

</div>


</div>




<div class="chat">


<div class="section-title">
little chat
</div>


<div class="messages">


<div class="message">

<strong>you</strong><br>

movie night? ♡

</div>


<div class="message">

<strong>boyfriend</strong><br>

always.

</div>


</div>



<div class="chat-input">


<input
type="text"
placeholder="say something..."
>


<button>
send
</button>


</div>


</div>


</aside>


</div>


</body>

</html>
