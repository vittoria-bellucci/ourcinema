<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>our cinema — room ♡</title>


<style>

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    min-height: 100vh;

    background:

    radial-gradient(
        circle at 50% 10%,
        rgba(255,255,255,0.12),
        transparent 20%
    ),

    radial-gradient(
        circle at 20% 30%,
        rgba(130,110,180,0.18),
        transparent 35%
    ),

    radial-gradient(
        circle at 80% 70%,
        rgba(80,70,130,0.2),
        transparent 35%
    ),

    linear-gradient(
        160deg,
        #090911,
        #151321,
        #26213a
    );

    color: #f5f1f4;

    font-family: Arial, sans-serif;

}

.browser-frame {

    flex:1;

    width:100%;

    min-height:500px;

    border:none;

    background:white;

    border-radius:0 0 12px 12px;

}
    
/* top bar */
body::before {

    content: "";

    position: fixed;

    inset: 0;

    pointer-events: none;

    background-image:

    radial-gradient(circle, white 1px, transparent 1px);

    background-size: 80px 80px;

    opacity: 0.25;

}
    
header {

    height: 70px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 30px;

    border-bottom: 1px solid rgba(255,255,255,0.08);

    background: rgba(10,9,18,0.7);

    backdrop-filter: blur(15px);

}
    
nav {

    display:flex;

    gap:20px;

}


nav a {

    color:#aaa0ae;

    text-decoration:none;

    font-size:12px;

    letter-spacing:2px;

    text-transform:uppercase;

}


nav a:hover {

    color:white;

}

.logo {

    font-family: Georgia, serif;

    font-size: 22px;

}


.room-name {

    font-size: 12px;

    letter-spacing: 3px;

    text-transform: uppercase;

    color: #aaa0ae;

}



/* layout */

.room {

    display: grid;

    grid-template-columns: 1fr 320px;

    min-height: calc(100vh - 70px);

}



/* browser */

.browser {

    padding: 25px;

    display: flex;

    flex-direction: column;

}


.browser-bar {

    height: 50px;

    display: flex;

    align-items: center;

    gap: 10px;

    padding: 8px 12px;

    background: rgba(255,255,255,0.06);

    border: 1px solid rgba(255,255,255,0.08);

    border-radius: 12px 12px 0 0;

}


.browser-button {

    color: #aaa;

    font-size: 14px;

    background: transparent;

    border: none;

    cursor: pointer;

    padding: 5px;

}


.browser-button:hover {

    color: white;

}


.url-bar {

    flex: 1;

    height: 32px;

    border: none;

    outline: none;

    border-radius: 8px;

    padding: 0 14px;

    background: rgba(255,255,255,0.07);

    color: white;

    font-size: 13px;

}



/* screen */

.screen 
    #browserFrame {

    width: 100%;

    height: 100%;

    min-height: 500px;

    border-radius: 0 0 12px 12px;

    background: white;

}

    flex: 1;

    min-height: 500px;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;

    background: rgba(0,0,0,0.35);

    border: 1px solid rgba(255,255,255,0.08);

    border-top: none;

    border-radius: 0 0 12px 12px;

}


.screen-content {

    color: #8f8792;

}


.movie-poster {

    font-size: 70px;

    margin-bottom: 20px;

}


.screen-icon {

    font-size: 45px;

    margin-bottom: 15px;

}


.screen-title {

    font-family: Georgia, serif;

    font-size: 25px;

    color: #ddd5dc;

}

/* movie button */

.movie-button {

    margin-top: 20px;

    padding: 14px 35px;

    border-radius: 50px;

    border: 1px solid rgba(255,255,255,0.25);

    background: rgba(255,255,255,0.08);

    color: white;

    cursor: pointer;

    font-family: Georgia, serif;

    font-size: 12px;

    letter-spacing: 3px;

    text-transform: uppercase;

    transition: 0.3s ease;

}


.movie-button:hover {

    background: rgba(255,255,255,0.18);

    transform: translateY(-3px);

}



/* sidebar */

.sidebar {

    border-left: 1px solid rgba(255,255,255,0.08);

    background: rgba(10,9,18,0.5);

    display: flex;

    flex-direction: column;

}


.people {

    padding: 25px;

    border-bottom: 1px solid rgba(255,255,255,0.08);

}


.section-title {

    font-size: 10px;

    letter-spacing: 3px;

    text-transform: uppercase;

    color: #817783;

    margin-bottom: 20px;

}


.person {

    display: flex;

    align-items: center;

    gap: 12px;

    margin-bottom: 15px;

}


.avatar {

    width: 35px;

    height: 35px;

    border-radius: 50%;

    display: flex;

    align-items: center;

    justify-content: center;

    background: #302a43;

}


.online {

    width: 7px;

    height: 7px;

    border-radius: 50%;

    background: #a8c6a1;

    margin-left: auto;

}



/* chat */

.chat {

    flex: 1;

    padding: 25px;

    display: flex;

    flex-direction: column;

}


.messages {

    flex: 1;

    color: #aaa0ae;

    font-size: 13px;

    line-height: 1.7;

}


.message {

    margin-bottom: 15px;

}


.message strong {

    color: #ddd5dc;

}


.chat-input {

    display: flex;

    gap: 8px;

}


.chat-input input {

    flex: 1;

    border: none;

    outline: none;

    border-radius: 8px;

    padding: 11px;

    background: rgba(255,255,255,0.07);

    color: white;

}


.chat-input button {

    border: none;

    border-radius: 8px;

    padding: 0 15px;

    background: #302a43;

    color: white;

    cursor: pointer;

}

.moon {

    position: fixed;

    top: 90px;

    right: 120px;

    width: 80px;

    height: 80px;

    border-radius: 50%;

    background: rgba(255,255,255,0.8);

    box-shadow:

    0 0 40px rgba(255,255,255,0.4);

    opacity: 0.8;

}

/* mobile */

@media (max-width: 800px) {

    .room {

        grid-template-columns: 1fr;

    }


    .sidebar {

        border-left: none;

        border-top: 1px solid rgba(255,255,255,0.08);

        min-height: 400px;

    }


    .screen {

        min-height: 400px;

    }

}


</style>

</head>


<body>


<div class="moon"></div>


<header>

<div class="logo">
    our little cinema ♡
</div>


<div class="room-name">
    private screening ♡
</div>

    
    <nav>

<a href="room.html">
watch
</a>

<a href="movies.html">
diary
</a>

</nav>

</header>



<div class="room">


<section class="browser">


<div class="browser-bar">


<span class="browser-button" onclick="goBack()">
←
</span>


<span class="browser-button" onclick="goForward()">
→
</span>


<span class="browser-button" onclick="reloadPage()">
↻
</span>



<input

id="urlBar"

class="url-bar"

placeholder="search or enter a website..."

onkeydown="openWebsite(event)"

>


</div>



<iframe

id="browserFrame"

class="browser-frame"

src="https://duckduckgo.com"

>

</iframe>


</div>


</section>




<aside class="sidebar">


<div class="people">


<div class="section-title">
watching together
</div>


<div class="person">

<div class="avatar">
♡
</div>

<span>
you
</span>

<div class="online"></div>

</div>



<div class="person">

<div class="avatar">
♡
</div>

<span>
boyfriend
</span>

<div class="online"></div>

</div>


</div>




<div class="chat">


<div class="section-title">
little chat
</div>


<div class="messages">


<div class="message">

<strong>you</strong><br>

movie night? ♡

</div>


<div class="message">

<strong>boyfriend</strong><br>

always.

</div>


</div>



<div class="chat-input">


<input
type="text"
placeholder="say something..."
>


<button>
send
</button>


</div>


</div>


</aside>


</div>

</body>
    
<script>

const frame = document.getElementById("browserFrame");

const urlBar = document.getElementById("urlBar");


function openWebsite(event){

    if(event.key === "Enter"){


        let input = urlBar.value.trim();


        if(input === ""){
            return;
        }


        let url;


        if(
            input.includes(".com") ||
            input.includes(".net") ||
            input.includes(".org") ||
            input.startsWith("http")
        ){

            if(!input.startsWith("http")){

                url = "https://" + input;

            } else {

                url = input;

            }


        } else {


            url = "https://duckduckgo.com/?q=" + encodeURIComponent(input);


        }


        frame.src = url;


    }

}
</script>
    
</html>
