<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>our little cinema ♡</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f8e8ee;
            font-family: Georgia, serif;
            color: #5b4149;
        }

        .cinema {
            text-align: center;
            padding: 40px;
        }

        .heart {
            font-size: 50px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 48px;
            font-weight: normal;
            margin: 0 0 15px;
        }

        p {
            font-size: 18px;
            font-style: italic;
            margin-bottom: 30px;
        }

        button {
            border: none;
            padding: 15px 30px;
            border-radius: 30px;
            background: #ffffff;
            color: #5b4149;
            font-family: Georgia, serif;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <div class="cinema">

        <div class="heart">♡</div>

        <h1>our little cinema</h1>

        <p>just you, me & whatever we're watching tonight.</p>

        <button onclick="alert('movie night? ♡')">
            enter our cinema
        </button>

    </div>

</body>
</html>
